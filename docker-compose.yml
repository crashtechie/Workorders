services:
  web:
    image: workorders-frontend:latest
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
    command: nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - api
  api:
    image: workorders-backend:latest
    ports:
      - "5000:5000"
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: uv run python main.py --host 0.0.0.0 --port  8080 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3