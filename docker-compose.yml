services:
  web:
    image: workorders-frontend:latest
    ports:
      - "80:80"
    volumes:
      - ./frontend:/app
    command: nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    depends_on:
      - backend
  backend:
    image: workorders-backend:latest
    ports:
      - "5000:5000"
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ./backend:/app
    command: python manage.py runserver 0.0.0.0:8080 --noreload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health/"]
      interval: 30s
      timeout: 10s
      retries: 3